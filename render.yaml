services:
  - type: web
    name: garderob
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: garderob-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: garderob-db
    plan: free
    databaseName: garderob
    user: garderob
